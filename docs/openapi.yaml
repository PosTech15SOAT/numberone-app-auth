openapi: 3.0.3
info:
  title: NumberOne Auth API
  version: 0.2.0
  description: Login de clientes e operadores da NumberOne.
  license:
    name: Academic
    url: https://github.com/PosTech15SOAT/numberone-app-auth
servers:
  - url: https://api-id.execute-api.us-east-1.amazonaws.com
    description: API Gateway HTTP API da Cloud
paths:
  /auth/login:
    post:
      summary: Autentica uma identidade cadastrada em Auth
      operationId: loginByCpf
      security: []
      parameters:
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
            example: numberone-auth-local-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, password]
              properties:
                cpf:
                  type: string
                  example: "52998224725"
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                identityType:
                  type: string
                  enum: [CUSTOMER, OPERATOR]
                  default: CUSTOMER
      responses:
        "200":
          description: Token JWT emitido.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 3600
        "400":
          description: CPF, tipo de identidade, correlação ou corpo inválido.
        "401":
          description: Credenciais inválidas, identidade inativa ou vínculo com a OS não confirmado.
        "429":
          description: Limite de requisições do Gateway atingido.
        "500":
          description: Erro interno.

name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - "**"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Repository validation executed successfully"
          test -f README.md

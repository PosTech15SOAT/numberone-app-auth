name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate repository structure
        run: |
          echo "Repository validation executed successfully"
          test -f README.md

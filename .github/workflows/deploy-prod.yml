name: Deploy PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Terraform apply PROD
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_environment: prod
      TF_VAR_aws_region: us-east-1
      TF_VAR_cloud_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_lambda_layer_zip_path: ${{ github.workspace }}/build/lambda-layer.zip
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuracao do AWS Academy
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TF_STATE_BUCKET TF_VAR_cloud_state_bucket; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the production environment."
              exit 1
            fi
          done
          aws sts get-caller-identity

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de validacao
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Testes
        run: pytest

      - name: Build Lambda Layer
        run: ./scripts/build-lambda-layer.sh

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=auth/prod/terraform.tfstate" -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
